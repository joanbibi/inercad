name: Publicar versión

# Al subir una etiqueta vX.Y.Z (que debe coincidir con la versión de package.json):
#   1) se prueban y se construyen los instaladores de Windows,
#   2) si SignPath está configurado, se firman InerCAD.exe y después el instalador y la versión portátil,
#   3) se crea la Release de GitHub con el instalador, la versión portátil y las huellas SHA-256,
#   4) se genera el sitio web con los enlaces de descarga reales y se publica en GitHub Pages.
#
# Firma de código con SignPath (opcional: sin configurar, se publica sin firmar).
# En Settings → Secrets and variables → Actions:
#   secreto   SIGNPATH_API_TOKEN            token de API de SignPath con permiso para enviar solicitudes
#   variable  SIGNPATH_ORGANIZATION_ID      ID de la organización en SignPath
#   variable  SIGNPATH_PROJECT_SLUG         (opcional) proyecto en SignPath; por defecto «inercad»
#   variable  SIGNPATH_SIGNING_POLICY_SLUG  (opcional) política de firma; por defecto «release-signing»
# Las configuraciones de artefacto («aplicacion» e «instaladores») están en .signpath/artifact-configurations/.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta existente que se va a publicar (p. ej. v1.0.0)'
        required: true

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read     # SignPath descarga los artefactos de esta ejecución
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: La etiqueta debe coincidir con la versión de package.json
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$V" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión $V de package.json"
            exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Dirección del sitio en GitHub Pages (dominio propio si está configurado)
        shell: bash
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "SITE_URL=https://${PAGES_HOST}${PAGES_BASE}" >> "$GITHUB_ENV"
          echo "SITE_BASE=${PAGES_BASE}/" >> "$GITHUB_ENV"

      - run: npm test

      - name: ¿Hay firma de código configurada?
        id: firma
        shell: bash
        env:
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          HAY_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          if [ -n "$ORG" ] && [ "$HAY_TOKEN" = "true" ]; then
            echo "activa=true" >> "$GITHUB_OUTPUT"
            echo "Se firmarán los ejecutables con SignPath."
          else
            echo "activa=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath no está configurado: los instaladores se publican sin firmar."
          fi

      - name: Instalador y versión portátil de Windows (sin firmar)
        if: steps.firma.outputs.activa != 'true'
        run: npm run dist

      # ---------- Con firma: aplicación → firma de InerCAD.exe → instaladores con esa aplicación → firma de los instaladores
      - name: Aplicación sin empaquetar
        if: steps.firma.outputs.activa == 'true'
        run: npm run dist:dir

      - name: Enviar InerCAD.exe a la firma
        id: app-sin-firmar
        if: steps.firma.outputs.activa == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-sin-firmar
          path: release/win-unpacked/InerCAD.exe
          if-no-files-found: error
          retention-days: 1

      - name: Firmar InerCAD.exe con SignPath
        if: steps.firma.outputs.activa == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'inercad' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: aplicacion
          github-artifact-id: ${{ steps.app-sin-firmar.outputs.artifact-id }}
          parameters: |
            version: "${{ env.V }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800   # cada solicitud se aprueba a mano en SignPath
          output-artifact-directory: firmado/app

      - name: Instalador y versión portátil con la aplicación firmada
        if: steps.firma.outputs.activa == 'true'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature firmado/app/InerCAD.exe
          if ($s.Status -ne 'Valid') { throw "InerCAD.exe no tiene una firma válida: $($s.Status) $($s.StatusMessage)" }
          Write-Host "InerCAD.exe firmado por $($s.SignerCertificate.Subject)"
          Move-Item release/win-unpacked firmado/win-unpacked
          Copy-Item firmado/app/InerCAD.exe firmado/win-unpacked/InerCAD.exe -Force
          npx electron-builder --win --x64 --prepackaged firmado/win-unpacked --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Enviar los instaladores a la firma
        id: instaladores-sin-firmar
        if: steps.firma.outputs.activa == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: instaladores-sin-firmar
          path: |
            release/InerCAD-Setup-${{ env.V }}.exe
            release/InerCAD-${{ env.V }}-portable.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Firmar los instaladores con SignPath
        if: steps.firma.outputs.activa == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'inercad' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: instaladores
          github-artifact-id: ${{ steps.instaladores-sin-firmar.outputs.artifact-id }}
          parameters: |
            version: "${{ env.V }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: firmado/instaladores

      - name: Comprobar y colocar los instaladores firmados
        if: steps.firma.outputs.activa == 'true'
        shell: pwsh
        run: |
          foreach ($n in "InerCAD-Setup-$env:V.exe", "InerCAD-$env:V-portable.exe") {
            $s = Get-AuthenticodeSignature "firmado/instaladores/$n"
            if ($s.Status -ne 'Valid') { throw "$n no tiene una firma válida: $($s.Status) $($s.StatusMessage)" }
            Write-Host "$n firmado por $($s.SignerCertificate.Subject)"
            Copy-Item "firmado/instaladores/$n" "release/$n" -Force
          }

      - name: Release de GitHub con los instaladores
        shell: bash
        run: |
          (cd release && sha256sum "InerCAD-Setup-$V.exe" "InerCAD-$V-portable.exe" > SHA256SUMS.txt)
          NOTAS="Descargas y huellas SHA-256: ${SITE_URL}/#descargar · Code signing policy (política de firma de código): ${SITE_URL}/firma.html"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "InerCAD $V" --notes "$NOTAS" --generate-notes --verify-tag
          gh release upload "$TAG" "release/InerCAD-Setup-$V.exe" "release/InerCAD-$V-portable.exe" release/SHA256SUMS.txt --clobber

      - name: Sitio web con los enlaces de descarga de esta versión
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'   # Git Bash no debe convertir --base=/repo/ en una ruta de Windows
          # anuncios, aviso legal y apoyo (variables del repositorio; ver README)
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          LEGAL_TITULAR: ${{ vars.LEGAL_TITULAR }}
          LEGAL_NIF: ${{ vars.LEGAL_NIF }}
          LEGAL_DOMICILIO: ${{ vars.LEGAL_DOMICILIO }}
          LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          APOYO_URL: ${{ vars.APOYO_URL }}
        run: |
          npm run site:web -- --site-url="$SITE_URL" --base="$SITE_BASE" --repo-url="https://github.com/${GITHUB_REPOSITORY}" --download-base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar-sitio:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
